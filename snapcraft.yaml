name: make-a-calendar-studio
title: Make a Calendar Studio
base: core24
version: "0.1.0"
summary: Design printable calendars and plan dates offline
description: |
  Make a Calendar Studio is an offline-first Linux desktop workspace for designing
  printable calendars and planning date-driven work.

  Create monthly and yearly grids; save local projects; count business days around
  US federal holidays; plan payroll dates and rotating shifts; compare 4-4-5,
  4-5-4, and 5-4-4 fiscal periods; convert dates; and export vector PDF/SVG,
  CSV, JSON, or ICS data.

  **Private by default:** calendars and projects stay on your device. The core app
  works offline; optional web resources open in your browser only when selected.

  **Related Make a Calendar resources**
  * [Make a Calendar](https://make-a-calendar.com/)
  * [Printable monthly calendars](https://make-a-calendar.com/monthly-calendars)
  * [Blank calendar templates](https://make-a-calendar.com/pages/blank-calendar)
  * [Calendar generator](https://make-a-calendar.com/calendar-generator)
  * [Multi-month calendars](https://make-a-calendar.com/multi-month-calendar)
  * [Business-day calculator](https://make-a-calendar.com/business-days-calculator)
  * [Pay-period calendar](https://make-a-calendar.com/pay-period-calendar)
  * [Rotating-shift calendar](https://make-a-calendar.com/shift-calendar)
  * [Fiscal calendar](https://make-a-calendar.com/fiscal-calendar)
  * [4-4-5 calendar](https://make-a-calendar.com/445-calendar), [4-5-4 calendar](https://make-a-calendar.com/454-calendar), and [5-4-4 calendar](https://make-a-calendar.com/544-calendar)
  * [Date tools](https://make-a-calendar.com/date-tools) and [date converters](https://make-a-calendar.com/converters)
  * [iCalendar generator](https://make-a-calendar.com/ical-generator)

  This independent, original desktop application is created by Ethan, the
  developer behind Make a Calendar. It is not the website packaged in a browser
  and does not use the website's private implementation.
license: MIT
icon: assets/make-a-calendar-studio.svg
website: https://make-a-calendar.com/
contact: https://github.com/makeacalendar/make-a-calendar-studio-linux/issues
source-code: https://github.com/makeacalendar/make-a-calendar-studio-linux
issues: https://github.com/makeacalendar/make-a-calendar-studio-linux/issues
grade: stable
confinement: strict
adopt-info: app

apps:
  make-a-calendar-studio:
    command: bin/make-calendar-studio
    desktop: usr/share/applications/com.makeacalendar.Studio.desktop
    common-id: com.makeacalendar.Studio.desktop
    extensions: [gnome]
  make-calendar-studio-cli:
    command: bin/make-calendar-studio-cli

parts:
  app:
    plugin: nil
    source: .
    parse-info:
      - usr/share/metainfo/com.makeacalendar.Studio.metainfo.xml
    stage-packages:
      - python3
      - python3-gi
      - gir1.2-gtk-4.0
      - gir1.2-adw-1
      - libadwaita-1-0
      - shared-mime-info
    override-build: |
      craftctl default
      install -d "$CRAFT_PART_INSTALL/src"
      cp -R src/make_a_calendar_studio "$CRAFT_PART_INSTALL/src/"
      install -Dm755 bin/make-calendar-studio "$CRAFT_PART_INSTALL/bin/make-calendar-studio"
      install -Dm755 bin/make-calendar-studio-cli "$CRAFT_PART_INSTALL/bin/make-calendar-studio-cli"
      install -Dm644 assets/com.makeacalendar.Studio.desktop "$CRAFT_PART_INSTALL/usr/share/applications/com.makeacalendar.Studio.desktop"
      install -Dm644 assets/com.makeacalendar.Studio.metainfo.xml "$CRAFT_PART_INSTALL/usr/share/metainfo/com.makeacalendar.Studio.metainfo.xml"
      install -Dm644 assets/make-a-calendar-studio.svg "$CRAFT_PART_INSTALL/usr/share/icons/hicolor/scalable/apps/make-a-calendar-studio.svg"
      rm -rf "$CRAFT_PART_INSTALL/tests" "$CRAFT_PART_INSTALL/docs" "$CRAFT_PART_INSTALL/.github" "$CRAFT_PART_INSTALL/.git"
