name: Linux verification

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core-and-desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GTK runtime and headless desktop tools
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 libadwaita-1-0 xvfb openbox xdotool scrot wmctrl
      - name: Install package and developer tools
        run: |
          python -m venv --system-site-packages .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e '.[dev]'
      - name: Run core and storage tests
        run: .venv/bin/python -m pytest -q
      - name: Lint source and tests
        run: .venv/bin/ruff check src tests tools
      - name: Compile Python sources
        run: .venv/bin/python -m compileall -q src tests tools
      - name: CLI calendar and vector export smoke checks
        run: |
          .venv/bin/make-calendar-studio-cli calendar 2027 1 --week-start monday
          .venv/bin/make-calendar-studio-cli export 2027 1 /tmp/studio-calendar.pdf --format pdf
          .venv/bin/make-calendar-studio-cli export 2027 1 /tmp/studio-calendar.svg --format svg
          file /tmp/studio-calendar.pdf /tmp/studio-calendar.svg
      - name: Start the real GTK application headlessly
        env:
          PYTHONPATH: src
        run: xvfb-run -a -s '-screen 0 1440x1000x24' /usr/bin/python3 tools/ui_smoke.py
      - name: Capture actual Linux application screens
        env:
          PYTHONPATH: src
          GUI_PYTHON: /usr/bin/python3
        run: xvfb-run -a -s '-screen 0 1440x1000x24' bash tools/capture-linux-screenshots.sh
      - uses: actions/upload-artifact@v4
        with:
          name: make-a-calendar-studio-linux-screenshots
          path: screenshots/*.png
          if-no-files-found: error
